# =============================================================================
# .github/workflows/ci.yml
#
# Runs on every pull_request and push to main.
#
# Jobs:
#   1. lint         — ESLint + Prettier check on Astro/TS
#   2. tf-validate  — tofu fmt + tofu validate on Cloudflare module
#   3. tf-sec       — Checkov scan on Terraform
#   4. build        — Docker multi-stage build
#   5. scan         — Trivy vulnerability scan on the built image
#   6. push         — Push to ghcr.io (main branch only)
#   7. deploy       — Bump image SHA in deployment.yaml and commit (main only)
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write          # needed for the deploy job to commit the tag bump
  packages: write          # needed to push to ghcr.io
  security-events: write   # needed to upload Trivy SARIF to GitHub Security

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/web

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint frontend
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Job 2: Terraform validate
  # ---------------------------------------------------------------------------
  tf-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: Install Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v0.67.0/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt && chmod +x /usr/local/bin/terragrunt

      - name: tofu fmt check
        run: |
          tofu fmt -check -recursive infrastructure/tofu/modules/

      - name: terragrunt hclfmt check
        run: |
          terragrunt hclfmt --check --diff infrastructure/

  # ---------------------------------------------------------------------------
  # Job 3: Checkov — IaC security scan
  # ---------------------------------------------------------------------------
  tf-sec:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/tofu/modules/cloudflare
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
          skip_check: CKV_TF_1   # module pinning — we use path references

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif

  # ---------------------------------------------------------------------------
  # Job 4 & 5: Build image + Trivy scan
  # ---------------------------------------------------------------------------
  build-and-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: [lint, tf-validate]

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}
      sha_tag: ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push on main only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Load locally for Trivy scan even on PRs
          load: ${{ github.event_name == 'pull_request' }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: "sarif"
          output: trivy.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1"   # Fail the build on CRITICAL or HIGH CVEs

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  # ---------------------------------------------------------------------------
  # Job 6: Bump image SHA in deployment.yaml and commit back to main
  # This triggers ArgoCD to sync the new image to the cluster.
  # Only runs on push to main after a successful build.
  # ---------------------------------------------------------------------------
  deploy:
    name: Update Image Tag
    runs-on: ubuntu-latest
    needs: [build-and-scan, tf-sec]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history so we can push back cleanly
          fetch-depth: 0

      - name: Update image tag in deployment.yaml
        run: |
          SHA_TAG="ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          sed -i "s|image: ghcr.io/${{ env.IMAGE_NAME }}:.*|image: ${SHA_TAG}|g" \
            kubernetes/apps/xavifortes-web/deployment.yaml
          echo "Updated deployment.yaml to ${SHA_TAG}"

      - name: Commit and push tag bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/apps/xavifortes-web/deployment.yaml
          git diff --cached --quiet || git commit -m "chore(deploy): bump web image to sha-${{ github.sha }} [skip ci]"
          git push
