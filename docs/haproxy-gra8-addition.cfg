# HAProxy GRA8 — xavifortes.com configuration
#
# This documents the changes made to /etc/haproxy/haproxy.cfg on vps-f24bf8b4
# (GRA8, 51.210.105.255) to support xavifortes.com.
#
# IMPORTANT: The existing :443 frontend was restructured from HTTP-mode SSL
# termination to a TCP-mode SNI router. This was necessary because HAProxy
# only held certs for inovexservices.com subdomains (strict-sni drops
# connections with no matching cert = Cloudflare 525 error).
#
# The new architecture:
#
#   :443  https_sni_router  (TCP mode, SNI inspection)
#         │
#         ├── SNI xavifortes.com / www.xavifortes.com
#         │       └──→ xavifortes_mad1_tcp  (TCP passthrough, no TLS termination)
#         │                 └──→ MAD1 Traefik :443 (holds LE cert, Cloudflare Full Strict)
#         │
#         └── everything else
#                 └──→ 127.0.0.1:4443  (loopback with PROXY protocol)
#                           └──→ https_front  (original SSL termination, accept-proxy)
#
#   :80   http_front  (HTTP mode)
#         ├── xavifortes.com / www.xavifortes.com
#         │       └──→ xavifortes_mad1_http  (MAD1 Traefik :80, for ACME HTTP-01)
#         └── everything else  →  existing backends
#
# =============================================================================
# Changes applied — add/replace in /etc/haproxy/haproxy.cfg
# =============================================================================

# ---------------------------------------------------------------------------
# 1. Replace the existing https_front bind line:
#
#   OLD:
#     frontend https_front
#        bind *:443 ssl crt /etc/haproxy/certs/ strict-sni
#        mode http
#        ...
#
#   NEW: Add https_sni_router before https_front, move https_front to loopback
# ---------------------------------------------------------------------------

# SNI pre-router (replaces direct :443 bind on https_front)
frontend https_sni_router
   mode tcp
   option tcplog
   bind *:443

   tcp-request inspect-delay 5s
   tcp-request content accept if { req_ssl_hello_type 1 }

   acl is_xavifortes     req_ssl_sni -i xavifortes.com
   acl is_www_xavifortes req_ssl_sni -i www.xavifortes.com
   use_backend xavifortes_mad1_tcp if is_xavifortes
   use_backend xavifortes_mad1_tcp if is_www_xavifortes

   default_backend https_ssl_termination

backend https_ssl_termination
   mode tcp
   server loopback 127.0.0.1:4443 send-proxy-v2

# Legacy SSL termination frontend (was the original https_front on :443)
# Note: bind changed to 127.0.0.1:4443 with accept-proxy
frontend https_front
   bind 127.0.0.1:4443 ssl crt /etc/haproxy/certs/ strict-sni accept-proxy
   mode http
   # ... existing ACLs and backends unchanged ...

# ---------------------------------------------------------------------------
# 2. Add to http_front (before default_backend http_back):
# ---------------------------------------------------------------------------

   acl ACL_xavifortes hdr(host) -i xavifortes.com www.xavifortes.com
   use_backend xavifortes_mad1_http if ACL_xavifortes

# ---------------------------------------------------------------------------
# 3. New backends (append to end of file):
# ---------------------------------------------------------------------------

# TCP passthrough to MAD1 Traefik — Traefik terminates TLS with LE cert
backend xavifortes_mad1_tcp
   mode tcp
   option ssl-hello-chk
   balance roundrobin
   server mad1-1 141.227.188.178:443 check inter 10s rise 2 fall 3
   server mad1-2 141.227.188.179:443 check inter 10s rise 2 fall 3
   server mad1-3 141.227.188.180:443 check inter 10s rise 2 fall 3

# HTTP backend for ACME HTTP-01 challenge validation and plain HTTP traffic
backend xavifortes_mad1_http
   mode http
   option forwardfor
   balance roundrobin
   server mad1-1 141.227.188.178:80 check inter 10s rise 2 fall 3
   server mad1-2 141.227.188.179:80 check inter 10s rise 2 fall 3
   server mad1-3 141.227.188.180:80 check inter 10s rise 2 fall 3

# =============================================================================
# MAD1 node IPs (OVH Madrid k3s cluster)
#
#   141.227.188.178  vps-6b58f204  (control-plane)
#   141.227.188.179  vps-04483f6e  (control-plane)
#   141.227.188.180  vps-d147fb4d  (control-plane)
#
# Traefik runs as a DaemonSet/LoadBalancer on all nodes, listening on :80/:443.
# =============================================================================
