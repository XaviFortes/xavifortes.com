# =============================================================================
# HAProxy configuration addition for GRA8 bastion
#
# Add the following blocks to /etc/haproxy/haproxy.cfg on the GRA8 VPS.
# The existing config already handles :80/:443 routing to homelab nginxproxymanager
# and :6443 to kubeadm API. This addition routes xavifortes.com to MAD1 Traefik.
#
# Deployment:
#   1. Add these blocks to haproxy.cfg via Ansible (ansible/playbooks/ovh-gra.yml)
#   2. Test config:  haproxy -c -f /etc/haproxy/haproxy.cfg
#   3. Reload:       systemctl reload haproxy
#
# Architecture note:
#   Cloudflare → GRA8 :443 → MAD1 Traefik :443 → xavifortes-web pod :8080
#   TLS is terminated at Traefik (cert-manager Let's Encrypt cert).
#   Cloudflare is configured Full Strict so it validates the origin cert.
# =============================================================================

# ---------------------------------------------------------------------------
# Frontend: HTTPS traffic for xavifortes.com
# Uses SNI-based routing to forward to the correct backend.
# If you're already using a TCP frontend for :443, add an ACL and use_backend.
# ---------------------------------------------------------------------------

frontend ft_https_xavifortes
    bind *:443
    mode tcp
    option tcplog

    # SNI inspection — forward xavifortes.com to MAD1 cluster
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # Route by SNI
    acl is_xavifortes  req_ssl_sni -i xavifortes.com
    acl is_www         req_ssl_sni -i www.xavifortes.com

    use_backend bk_mad1_traefik if is_xavifortes
    use_backend bk_mad1_traefik if is_www

    # Default backend (existing homelab nginxproxymanager or other services)
    default_backend bk_homelab_npm

# ---------------------------------------------------------------------------
# Backend: OVH MAD1 k3s cluster — Traefik NodePort or LoadBalancer IP
# Replace 10.x.x.x with the actual MAD1 node IPs.
# Traefik listens on :443 (websecure entrypoint).
# ---------------------------------------------------------------------------

backend bk_mad1_traefik
    mode tcp
    option ssl-hello-chk
    balance roundrobin

    # All 3 MAD1 nodes — Traefik is a DaemonSet or runs on all nodes
    # Replace with actual private/public IPs of MAD1 nodes
    server mad1-1 <MAD1_NODE_1_IP>:443 check inter 10s rise 2 fall 3
    server mad1-2 <MAD1_NODE_2_IP>:443 check inter 10s rise 2 fall 3
    server mad1-3 <MAD1_NODE_3_IP>:443 check inter 10s rise 2 fall 3

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect (handled at Cloudflare level, but belt-and-suspenders)
# ---------------------------------------------------------------------------

frontend ft_http
    bind *:80
    mode http
    option httplog

    # Redirect all HTTP to HTTPS
    redirect scheme https code 301

# ---------------------------------------------------------------------------
# Stats page (optional — remove in production or restrict to trusted IPs)
# ---------------------------------------------------------------------------

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:changeme
    # Restrict to localhost or trusted CIDR only
    acl local src 127.0.0.1
    tcp-request connection reject if !local
