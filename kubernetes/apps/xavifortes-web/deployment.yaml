---
# kubernetes/apps/xavifortes-web/deployment.yaml
#
# Image tag is automatically updated by the CI pipeline after a successful
# ghcr.io push. ArgoCD detects the diff and self-heals within ~3 minutes.
#
# DO NOT manually edit the image tag line — it is managed by GitHub Actions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xavifortes-web
  namespace: xavifortes
  labels:
    app: xavifortes-web
    app.kubernetes.io/name: xavifortes-web
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xavifortes-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: xavifortes-web
    spec:
      # Pull secret for ghcr.io private registry
      imagePullSecrets:
        - name: ghcr-pull-secret

      # Spread across nodes for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: xavifortes-web

      containers:
        - name: web
          # CI pipeline updates this tag automatically — do not edit manually
          image: ghcr.io/xavifortes/web:sha-442b719211c656501944f1ba4ec82222c60a71de
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: false   # nginx writes to /var/cache/nginx
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101                   # nginx uid in nginx:alpine
            capabilities:
              drop:
                - ALL

      securityContext:
        fsGroup: 101
