---
# kubernetes/apps/xavifortes-web/ingress.yaml
#
# Traefik IngressRoute for xavifortes.com.
# TLS is terminated at Cloudflare (Full Strict) — Cloudflare presents its edge
# cert to the user; this cert covers the Cloudflare → GRA8 → MAD1 leg.
#
# cert-manager issues a Let's Encrypt cert for xavifortes.com and stores it
# in the `xavifortes-tls` Secret below. Traefik uses it for the backend leg.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: xavifortes-web
  namespace: xavifortes
  labels:
    app: xavifortes-web
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`xavifortes.com`) || Host(`www.xavifortes.com`)
      kind: Rule
      services:
        - name: xavifortes-web
          port: 80
      middlewares:
        - name: www-redirect
  tls:
    secretName: xavifortes-tls

---
# Redirect www → apex
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
  namespace: xavifortes
spec:
  redirectRegex:
    regex: "^https://www\\.xavifortes\\.com/(.*)"
    replacement: "https://xavifortes.com/${1}"
    permanent: true

---
# cert-manager Certificate resource
#
# Uses the HTTP-01 solver via the `letsencrypt-prod` ClusterIssuer — the only
# issuer actually present in the cluster. Port 80 reaches Traefik through
# Cloudflare and the GRA8 HAProxy (frontend http_front -> xavifortes_mad1_http),
# so HTTP-01 validates without issue, as it does for the matrix/telemetry certs.
#
# NOTE: deliberately no wildcard. A wildcard requires DNS-01, which needs the
# `letsencrypt-prod-dns01` ClusterIssuer from
# kubernetes/core/cert-manager/clusterissuer-dns01.yaml. That manifest exists in
# this repo but was never applied to the cluster, and is not part of any ArgoCD
# Application. Pointing this Certificate at the missing issuer made every renewal
# fail with `Referenced "ClusterIssuer" not found`, so the cert silently went
# stale from its 2026-07-15 renewal time and expired on 2026-08-14 — which broke
# Cloudflare Full (strict) with error 526.
#
# The IngressRoute above only routes the apex and www, so no wildcard is needed.
# If wildcard coverage is wanted later, apply the two cert-manager core manifests
# first, then switch issuerRef back.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: xavifortes-tls
  namespace: xavifortes
spec:
  secretName: xavifortes-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - xavifortes.com
    - www.xavifortes.com
