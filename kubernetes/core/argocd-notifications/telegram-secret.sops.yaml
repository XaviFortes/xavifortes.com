# kubernetes/core/argocd-notifications/telegram-secret.sops.yaml
#
# SOPS-encrypted secret containing the Telegram bot token and chat ID
# for ArgoCD notifications.
#
# SETUP INSTRUCTIONS:
# ===================
# 1. Create a Telegram bot:
#    - Message @BotFather on Telegram
#    - /newbot → follow prompts → copy the bot token
#
# 2. Get your chat ID:
#    - Start a conversation with your bot (or add it to a group)
#    - Visit: https://api.telegram.org/bot<TOKEN>/getUpdates
#    - Find "chat":{"id": <YOUR_CHAT_ID>}
#
# 3. Create and encrypt the secret:
#
#    BOT_TOKEN="1234567890:ABCdef..."
#    CHAT_ID="-100123456789"   # use negative ID for groups/channels
#
#    kubectl create secret generic argocd-notifications-secret \
#      --from-literal=telegram-token="$BOT_TOKEN" \
#      -n argocd \
#      --dry-run=client -o yaml \
#    | sops --encrypt --input-type yaml --output-type yaml \
#        --encrypted-regex '^(data|stringData)$' \
#        /dev/stdin > kubernetes/core/argocd-notifications/telegram-secret.sops.yaml
#
#    # Also store the chat ID (not secret but convenient to keep together):
#    # Edit the configmap below and replace <YOUR_TELEGRAM_CHAT_ID>
#
# 4. Apply:
#    sops -d kubernetes/core/argocd-notifications/telegram-secret.sops.yaml \
#      | kubectl apply -f -
#
