---
# kubernetes/core/cert-manager/clusterissuer-dns01.yaml
#
# ClusterIssuer using Cloudflare DNS-01 solver.
#
# Why DNS-01 over HTTP-01:
#   - No port 80 routing required through HAProxy
#   - Works even if the site is down
#   - Supports wildcard certificates (*.xavifortes.com)
#   - Decoupled from HAProxy/Traefik routing entirely
#
# Prerequisites:
#   - Apply the cloudflare-api-token secret first:
#       kubectl apply -f kubernetes/core/cert-manager/cloudflare-api-token.yaml
#     (that file is SOPS-encrypted, decrypt first with:
#       sops -d kubernetes/core/cert-manager/cloudflare-api-token.sops.yaml | kubectl apply -f -)
#
# The Cloudflare API token needs:
#   Zone > DNS > Edit  (scoped to xavifortes.com zone only)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: xavifortes@xavifortes.com
    privateKeySecretRef:
      name: letsencrypt-prod-dns01-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-dns01
              key: api-token
        selector:
          dnsZones:
            - xavifortes.com
