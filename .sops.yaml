# .sops.yaml — SOPS encryption config for xavifortes.com
#
# Uses the same Age keys as shellnet-infrastructure.
# Primary key: local ~/.config/sops/age/keys.txt
# CI key: stored as SOPS_AGE_KEY GitHub Actions secret
#
# To encrypt a new secrets file:
#   sops -e -i infrastructure/tofu/live/cloudflare/secrets.sops.json

creation_rules:
  - path_regex: infrastructure/tofu/live/.*/secrets(\.sops)?\.json$
    key_groups:
      - age:
          - &primary age1kttje7qaqggnssmu4a40ptm649wthp0twmd4c9jsjstkpnuptqdqp3fkc0
          - &ci     age15m998ttvguwq46xpz4e6yvdaaprxzucqr33t98c3mtgrlcymwgfsfew9ch

  - path_regex: infrastructure/tofu/live/common(\.sops)?\.json$
    key_groups:
      - age:
          - *primary
          - *ci
